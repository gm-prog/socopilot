services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
    - 5432:5432
    environment:
      POSTGRES_USER: socopilot
      POSTGRES_PASSWORD: socopilot_dev
      POSTGRES_DB: socopilot
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U socopilot -d socopilot
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
    - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    ports:
    - 6379:6379
    command: redis-server --appendonly yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
    ports:
    - 11434:11434
    volumes:
    - /mnt/c/Users/deysa/.ollama:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/images/api.Dockerfile
    container_name: api
    ports:
    - 8000:8000
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
      TORCHINDUCTOR_CACHE_DIR: /tmp/torch_cache
      HF_HOME: /tmp/hf_cache
      TRANSFORMERS_CACHE: /tmp/hf_cache
    volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway

  worker-ingest:
    build:
      context: ..
      dockerfile: docker/images/worker.Dockerfile
    container_name: worker-ingest
    hostname: worker-ingest
    command: celery -A app.workers.celery_app:celery_app worker -Q ingest --loglevel=info --concurrency=4 --heartbeat-interval=30
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_BROKER_HEARTBEAT: 30
      CELERY_EVENT_QUEUE_EXPIRES: 120
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      OLLAMA_HOST: http://ollama:11434
    volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway

  worker-processing:
    build:
      context: ..
      dockerfile: docker/images/worker.Dockerfile
    container_name: worker-processing
    hostname: worker-processing
    command: celery -A app.workers.celery_app:celery_app worker -Q processing --loglevel=info --concurrency=2 --heartbeat-interval=30
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_BROKER_HEARTBEAT: 30
      CELERY_EVENT_QUEUE_EXPIRES: 120
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      OLLAMA_HOST: http://ollama:11434
    volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway

  worker-enrichment:
    build:
      context: ..
      dockerfile: docker/images/worker.Dockerfile
    container_name: worker-enrichment
    hostname: worker-enrichment
    command: celery -A app.workers.celery_app:celery_app worker -Q enrichment --loglevel=info --concurrency=1 --heartbeat-interval=30 --pool=solo
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_BROKER_HEARTBEAT: 30
      CELERY_EVENT_QUEUE_EXPIRES: 120
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      OLLAMA_HOST: http://ollama:11434
    volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway

  celery-beat:
    build:
      context: ..
      dockerfile: docker/images/worker.Dockerfile
    container_name: celery-beat
    hostname: celery-beat
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
    - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_HOST: http://ollama:11434
    volumes:
    - ../backend/app:/app/app:ro
    - ../backend/alembic:/app/alembic:ro
    - ../backend/static:/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api
    ports:
    - 3000:3000
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    environment:
      - cluster.name=socopilot-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
    volumes:
    - ../frontend/dist:/usr/share/nginx/html:ro
    - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api
    restart: unless-stopped

volumes:
  ollama_data: null
  postgres_data: null
