services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=socopilot
      - POSTGRES_PASSWORD=socopilot_dev
      - POSTGRES_DB=socopilot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U socopilot -d socopilot" ]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional: mount init scripts to create extensions (runs only on fresh DB)
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/images/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://socopilot:socopilot_dev@postgres:5432/socopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: docker/images/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=
    depends_on:
      - api
    restart: unless-stopped
