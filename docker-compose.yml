services:
  redis:
    image: redis:7-alpine
    container_name: socopilot-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: socopilot-postgres
    environment:
      POSTGRES_USER: socopilot
      POSTGRES_PASSWORD: socopilot
      POSTGRES_DB: socopilot
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    container_name: socopilot-api
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://socopilot:socopilot@postgres:5432/socopilot
    ports:
      - "8000:8000"
